<nav
  style="
    --bs-breadcrumb-divider: url(
      &#34;data:image/svg + xml,
      %3Csvgxmlns=&quot;http://www.w3.org/2000/svg&quot;width=&quot;8&quot;height=&quot;8&quot;%3E%3Cpathd=&quot;M2.5 0L1 1.5 3.5 4 1 6.5 2.5 8l4-4-4-4z&quot;fill=&quot;%236c757d&quot;/%3E%3C/svg%3E&#34;
    );
  "
  aria-label="breadcrumb"
>
  <ol class="breadcrumb" style="margin-bottom: 2px">
    {{ range after 1 .Ancestors.Reverse }}
    <li class="breadcrumb-item breadcrumb-nav-item">
      <a
        class="breadcrumb-color"
        href="{{ .RelPermalink }}"
        style="text-decoration: none"
        >{{ .LinkTitle }}</a
      >
    </li>
    {{ end }}

    <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
  </ol>
</nav>
